[workspace]
resolver = "3"
members = ["crates/gizai-core", "crates/gizai-agents", "crates/gizai-mcp", "src-tauri"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.7"

[workspace.dependencies]
rusqlite = { version = "0.40", features = ["bundled", "serde_json"] }
rusqlite_migration = "2"
uuid = { version = "1", features = ["v7"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt-multi-thread", "macros", "net"] }
libc = "0.2"
tempfile = "3"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
