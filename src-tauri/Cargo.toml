[package]
name = "gizai"
description = "Gizai: clients, projects, tasks and local AI agents"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "gizai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
gizai-core = { path = "../crates/gizai-core" }
gizai-agents = { path = "../crates/gizai-agents" }
gizai-mcp = { path = "../crates/gizai-mcp" }
tokio = { workspace = true, features = ["signal"] }
tauri-plugin-opener = "2"
libc = { workspace = true }
tauri-plugin-single-instance = "2"
# Desktop notifications (see src/notifications.rs): tauri-plugin-notification can't tell a click on Linux, this can.
notify-rust = "4.18"

# Ends WebKit's page process before Gizai quits (see src/quit.rs).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_34"] }

# The chat tools' named pipe (src/mcp.rs), logging off (src/quit.rs) and the notifications' app identity on Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
