# Builds and tests Gizai on Linux, macOS (Apple silicon) and Windows, on every pull request and every push to main.
# A pull request into main that only bumps Gizai's version passes without building or testing (the "Version only?"
# step). It signs, releases and uploads nothing.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      # Windows' git turns LF into CRLF on checkout; the tests read scripts and text files as they are in the repository.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # A release's first step, the version bump's pull request into main, skips the rest when it changes nothing but
      # Gizai's version: the release's pull request into production runs it all (docs/RELEASING.md, Making a release).
      # The steps are skipped one by one, as a job skipped with if: never reports its matrix's three checks, and
      # branch protection would wait for them. HEAD is the pull request's merge commit, and HEAD^1 is main. When the
      # fetch or the check fails, everything runs.
      - name: Version only?
        id: version
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        shell: bash
        run: |
          git fetch --quiet --no-tags --depth=2 origin "$GITHUB_SHA" || exit 0
          if node scripts/version-only.mjs HEAD^1 HEAD; then echo "only=true" >> "$GITHUB_OUTPUT"; fi

      # Many tests make git commits, and a runner has no git identity of its own.
      - name: Git identity for the tests
        if: steps.version.outputs.only != 'true'
        run: |
          git config --global user.name "Gizai CI"
          git config --global user.email "ci@gizai.invalid"
          git config --global init.defaultBranch main

      # What Tauri 2 needs on Linux (the packages install.sh names for Debian and Ubuntu), and D-Bus for the keychain.
      - name: Linux packages
        if: steps.version.outputs.only != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev libdbus-1-dev build-essential pkg-config patchelf curl wget file

      - uses: actions/setup-node@v4
        if: steps.version.outputs.only != 'true'
        with:
          node-version: 22 # the README asks for Node.js 20 or newer; Vite 8 needs 20.19 or 22.12 and up
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.only != 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.only != 'true'

      # The install scripts parse, and their checks pass (--check and -Check install nothing). On macOS install.sh must
      # work with the system's own bash, 3.2; install.ps1 with Windows PowerShell 5.1 (what an update runs) and 7.
      - name: Check install.sh
        if: steps.version.outputs.only != 'true' && runner.os != 'Windows'
        run: |
          /bin/bash -n install.sh
          /bin/bash ./install.sh --check

      - name: Check install.ps1 (PowerShell 7)
        if: steps.version.outputs.only != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null; $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$tokens, [ref]$errs) | Out-Null
          if ($errs) { $errs; exit 1 }
          pwsh -NoProfile -File .\install.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check install.ps1 (Windows PowerShell 5.1)
        if: steps.version.outputs.only != 'true' && runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null; $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$tokens, [ref]$errs) | Out-Null
          if ($errs) { $errs; exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The one-line installs: get.sh passes sh -n, and get.ps1 parses in both PowerShells. Then each one's check runs
      # the way the one line runs it, get.sh from a pipe (dash on Linux, macOS's own sh) and get.ps1 from memory (as
      # irm | iex does), into a scratch folder: first production from GitHub, then this pull request's own commit over
      # it (GIZAI_REPO and GIZAI_REF), which the folder must hold at the end.
      - name: Check get.sh
        if: steps.version.outputs.only != 'true' && runner.os != 'Windows'
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/get-sh
        run: |
          /bin/sh -n scripts/get.sh
          cat scripts/get.sh | GIZAI_REPO=https://github.com/Yotech-AI/gizai.git GIZAI_REF=production /bin/sh -s -- --check
          cat scripts/get.sh | GIZAI_REPO="$GITHUB_WORKSPACE" GIZAI_REF=HEAD /bin/sh -s -- --check
          test "$(git -C "$XDG_DATA_HOME/gizai-src" rev-parse HEAD)" = "$GITHUB_SHA"

      # get.ps1 runs from memory in a PowerShell of its own, which must go on after it: piped into iex, get.ps1 returns
      # rather than exit (which would close the window), with its result in $LASTEXITCODE. Run as a file, it exits
      # with that result: 0, and 1 for a ref that doesn't exist.
      - name: Check get.ps1 (PowerShell 7)
        if: steps.version.outputs.only != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null; $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\get.ps1", [ref]$tokens, [ref]$errs) | Out-Null
          if ($errs) { $errs; exit 1 }
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\get-ps1-7"
          $iex = "$env:RUNNER_TEMP\iex-get-ps1-7.ps1"
          Set-Content -LiteralPath $iex -Value '& ([scriptblock]::Create((Get-Content -LiteralPath scripts\get.ps1 -Raw))) -Check; "returned $LASTEXITCODE"'
          foreach ($from in @('https://github.com/Yotech-AI/gizai.git', 'production'), @($env:GITHUB_WORKSPACE, 'HEAD')) {
            $env:GIZAI_REPO = $from[0]; $env:GIZAI_REF = $from[1]
            pwsh -NoProfile -File $iex | Tee-Object -Variable out
            if (@($out)[-1] -ne 'returned 0') { "get.ps1 -Check didn't return 0 for $from"; exit 1 }
          }
          pwsh -NoProfile -File scripts\get.ps1 -Check
          if ($LASTEXITCODE -ne 0) { "get.ps1 -Check as a file exited with $LASTEXITCODE, not 0"; exit 1 }
          $env:GIZAI_REF = 'no-such-ref'
          pwsh -NoProfile -File scripts\get.ps1 -Check
          if ($LASTEXITCODE -ne 1) { "get.ps1 -Check as a file exited with $LASTEXITCODE for a ref that doesn't exist, not 1"; exit 1 }
          $head = git -C "$env:LOCALAPPDATA\gizai-src" rev-parse HEAD
          if ($head -ne $env:GITHUB_SHA) { "gizai-src is at $head, not at $env:GITHUB_SHA"; exit 1 }

      - name: Check get.ps1 (Windows PowerShell 5.1)
        if: steps.version.outputs.only != 'true' && runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null; $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\get.ps1", [ref]$tokens, [ref]$errs) | Out-Null
          if ($errs) { $errs; exit 1 }
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\get-ps1-5"
          $iex = "$env:RUNNER_TEMP\iex-get-ps1-5.ps1"
          Set-Content -LiteralPath $iex -Value '& ([scriptblock]::Create((Get-Content -LiteralPath scripts\get.ps1 -Raw))) -Check; "returned $LASTEXITCODE"'
          foreach ($from in @('https://github.com/Yotech-AI/gizai.git', 'production'), @($env:GITHUB_WORKSPACE, 'HEAD')) {
            $env:GIZAI_REPO = $from[0]; $env:GIZAI_REF = $from[1]
            powershell -NoProfile -ExecutionPolicy Bypass -File $iex | Tee-Object -Variable out
            if (@($out)[-1] -ne 'returned 0') { "get.ps1 -Check didn't return 0 for $from"; exit 1 }
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\get.ps1 -Check
          if ($LASTEXITCODE -ne 0) { "get.ps1 -Check as a file exited with $LASTEXITCODE, not 0"; exit 1 }
          $env:GIZAI_REF = 'no-such-ref'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\get.ps1 -Check
          if ($LASTEXITCODE -ne 1) { "get.ps1 -Check as a file exited with $LASTEXITCODE for a ref that doesn't exist, not 1"; exit 1 }
          $head = git -C "$env:LOCALAPPDATA\gizai-src" rev-parse HEAD
          if ($head -ne $env:GITHUB_SHA) { "gizai-src is at $head, not at $env:GITHUB_SHA"; exit 1 }

      - run: npm ci
        if: steps.version.outputs.only != 'true'

      - run: npm run build
        if: steps.version.outputs.only != 'true'

      # First, as it takes seconds: it still runs when the Rust tests fail later.
      - run: npm test
        if: steps.version.outputs.only != 'true'

      # Gizai and its helpers on their own first, so a test that doesn't build still shows whether the app itself does.
      - run: cargo build --workspace
        if: steps.version.outputs.only != 'true'

      # Every test binary, also after one fails, so one run shows all the failures on a system.
      - run: cargo test --workspace --no-fail-fast
        if: steps.version.outputs.only != 'true'
